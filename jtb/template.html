<title>شاشة تحفيظ بريدة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap">
<style>
/* Cinematic board: the association's photographs fill the screen with a slow Ken Burns drift and change with
   every chapter; a navy grade darkens the start side and the bottom so the type sits on calm ground. The
   achievements are the hero — huge gold figures that count up — and prayer times run along a lower third.
   Everything is sized in rem on a 1920×1080 design (1rem = 10 design px), so the TV renders it crisp at any
   density and the layout never reflows. Palette and faces are the association's own. */
@font-face{font-family:"Huwiya";src:url(data:font/woff;base64,__HUWIYA_REG__) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Huwiya";src:url(data:font/woff;base64,__HUWIYA_SB__) format("woff");font-weight:600;font-display:swap}
@font-face{font-family:"Zunburk";src:url(data:font/woff;base64,__ZUNBURK__) format("woff");font-weight:700;font-display:swap}

:root{
  --navy:#072C49;        /* ground */
  --navy-rgb:7,44,73;
  --teal:#007A97;        /* accent */
  --sky:#9DDAE5;         /* secondary text */
  --gold:#DBAE6A;        /* highlight, ornament */
  --gold-2:#F1D3A1;      /* gold, lit */
  --cream:#ECE6DD;       /* primary text */
  --line:rgba(236,230,221,.16);
  --display:"Zunburk","Huwiya",system-ui,sans-serif;
  --quran:"Amiri Quran","Traditional Arabic",serif;
  --body:"Huwiya","IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
  font-size:min(calc(100vw / 192), calc(100vh / 108));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--cream);font-family:var(--body);direction:rtl;overflow:hidden;
  cursor:none;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ── picture ── */
.shift{position:fixed;inset:0;transition:transform 3s ease}
.bg{position:absolute;inset:0;overflow:hidden;background:var(--navy)}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:opacity 2.4s ease;transform:scale(1.14);will-change:transform,opacity}
.bg img.on,.bg img.out{animation:drift 26s linear forwards}
.bg img.on{opacity:1}
.bg img:nth-child(3n+1){--x:-2.5%;--y:-1.5%}
.bg img:nth-child(3n+2){--x:2.5%;--y:1%}
.bg img:nth-child(3n){--x:-1%;--y:2%}
@keyframes drift{from{transform:scale(1.14) translate(var(--x,0),var(--y,0))}to{transform:scale(1.02) translate(0,0)}}
.grade{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to top,rgba(var(--navy-rgb),.97) 0%,rgba(var(--navy-rgb),.84) 16%,rgba(var(--navy-rgb),.2) 36%,rgba(var(--navy-rgb),0) 50%),
  linear-gradient(to left,rgba(var(--navy-rgb),.93) 0%,rgba(var(--navy-rgb),.78) 30%,rgba(var(--navy-rgb),.3) 56%,rgba(var(--navy-rgb),0) 78%),
  linear-gradient(to bottom,rgba(var(--navy-rgb),.72) 0%,rgba(var(--navy-rgb),0) 20%),
  radial-gradient(120% 90% at 50% 50%,transparent 60%,rgba(0,0,0,.38) 100%)}
.rosette{position:absolute;pointer-events:none;top:-14rem;right:-12rem;width:78rem;aspect-ratio:345/400;
  background:var(--gold);opacity:.07;
  -webkit-mask:url(data:image/png;base64,__ORNAMENT__) center/contain no-repeat;
  mask:url(data:image/png;base64,__ORNAMENT__) center/contain no-repeat}

.night{position:fixed;inset:0;z-index:18;pointer-events:none;background:#000;opacity:0;transition:opacity 60s linear}
.boot{position:fixed;inset:0;z-index:40;background:var(--navy);transition:opacity 1.4s ease}
.boot.gone{opacity:0;pointer-events:none}

/* ── canvas: a fixed 1920×1080 design, centred ── */
.canvas{position:fixed;z-index:2;left:50%;top:50%;width:192rem;height:108rem;transform:translate(-50%,-50%);transition:transform 3s ease}

/* ── masthead ── */
.top{position:absolute;top:5.4rem;right:9.6rem;left:9.6rem;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:2.4rem}
.brand svg{height:9.6rem;width:auto;flex:none;filter:drop-shadow(0 .4rem 1.6rem rgba(0,0,0,.35))}
.brand .rule{width:1px;height:6.4rem;background:linear-gradient(to bottom,transparent,var(--gold),transparent);opacity:.7}
.brand h1{margin:0;font-weight:600;font-size:3.2rem;line-height:1.25;color:var(--cream)}
.brand p{margin:.6rem 0 0;color:var(--sky);font-size:2rem}
.when{text-align:left;direction:rtl}
.clock{font-family:var(--display);font-weight:700;font-size:7.2rem;line-height:1;color:var(--cream);
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:1.2rem;justify-content:flex-end;flex-direction:row-reverse}
.clock .ap{font-family:var(--body);font-weight:600;font-size:2.2rem;color:var(--gold)}
.dates{margin-top:1rem;font-size:2.1rem;color:var(--sky)}
.dates b{color:var(--gold-2);font-weight:600}
.dates i{font-style:normal;opacity:.5;margin:0 .8rem}

/* ── hero: one chapter at a time ── */
.hero{position:absolute;right:9.6rem;top:22rem;width:150rem;height:58rem}
.ch{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:2.8rem;
  visibility:hidden}
.ch.on{visibility:visible}
.ch .r{opacity:0;transform:translateY(3.2rem);filter:blur(.6rem);
  transition:opacity .5s ease,transform .5s ease,filter .5s ease}
.ch.on .r{opacity:1;transform:none;filter:none;
  transition:opacity 1.1s cubic-bezier(.2,.7,.2,1) var(--d,0s),transform 1.3s cubic-bezier(.2,.7,.2,1) var(--d,0s),filter 1.1s ease var(--d,0s)}
.ch.leaving{visibility:visible}

.kicker{display:flex;align-items:center;gap:1.6rem;color:var(--gold);font-weight:600;font-size:2.4rem}
.kicker::before{content:"";width:6.4rem;height:.3rem;border-radius:1rem;background:linear-gradient(to left,var(--gold),rgba(219,174,106,0))}
.ch h2{margin:0;font-family:var(--display);font-weight:700;color:var(--cream);line-height:1.3;text-wrap:balance;
  text-shadow:0 .4rem 3rem rgba(0,0,0,.35)}

/* achievements */
.ch.stats h2{font-size:6.4rem;max-width:120rem}
.figs{display:flex;align-items:stretch;margin-top:2.4rem}
.fig{padding-inline:5.2rem;border-inline-start:1px solid rgba(219,174,106,.32);min-width:0;max-width:38rem}
.fig:first-child{padding-inline-start:0;border-inline-start:0}
.fig .n{font-family:var(--display);font-weight:700;font-size:12.8rem;line-height:1;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:var(--gold);
  background:linear-gradient(180deg,var(--gold-2) 10%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 .6rem 2.4rem rgba(0,0,0,.35))}
.fig .l{margin-top:2rem;font-size:2.6rem;line-height:1.55;color:rgba(236,230,221,.9);text-wrap:balance}

/* announcement */
.ch.ann h2{font-size:10.4rem;line-height:1.2;max-width:130rem}
.ch.ann .body{margin:0;font-size:3.6rem;line-height:1.75;color:rgba(236,230,221,.88);max-width:110rem;text-wrap:pretty}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:1.4rem;font-size:2.8rem;font-weight:600;color:var(--gold-2);
  border:1px solid rgba(219,174,106,.55);border-radius:10rem;padding:1.2rem 3.2rem;background:rgba(var(--navy-rgb),.45)}
.pill::before{content:"";width:1.2rem;height:1.2rem;border-radius:50%;background:var(--gold);box-shadow:0 0 1.6rem var(--gold)}

/* project: the building's render, lit from the ground up to the completed share */
.ch.proj{flex-direction:row;align-items:center;justify-content:space-between;gap:6rem}
.ch.proj .txt{flex:none;width:50rem;display:flex;flex-direction:column;gap:2.4rem}
.ch.proj h2{font-size:6.4rem}
.bld{position:relative;flex:none;width:94rem;aspect-ratio:1800/843;
  -webkit-mask:linear-gradient(to left,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 80%,transparent);
  -webkit-mask-composite:source-in;
  mask:linear-gradient(to left,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 80%,transparent);
  mask-composite:intersect}
.bld img{position:absolute;inset:0;width:100%;height:100%;display:block}
.bld .ghost{filter:grayscale(1) brightness(.5) contrast(.85) sepia(.2) hue-rotate(170deg);opacity:.5}
.bld .lit{filter:brightness(1.12) saturate(1.1)}
.bld .lit{clip-path:inset(92% 0 0 0);transition:clip-path 2.6s cubic-bezier(.2,.7,.2,1) .7s}
.bld .lvl{position:absolute;right:6%;left:6%;top:92%;height:0;border-top:.3rem solid var(--gold);
  box-shadow:0 0 2.4rem .4rem rgba(219,174,106,.55);transition:top 2.6s cubic-bezier(.2,.7,.2,1) .7s}
.bld .lvl span{position:absolute;right:0;bottom:1.4rem;font-family:var(--display);font-weight:700;font-size:3.6rem;
  color:var(--gold-2);background:rgba(var(--navy-rgb),.78);border:1px solid rgba(219,174,106,.5);border-radius:10rem;padding:.6rem 2rem}
.focus{position:absolute;inset:0;background:var(--navy);opacity:0;transition:opacity 1.6s ease;pointer-events:none}
.focus.on{opacity:.82}
.big{display:flex;align-items:baseline;gap:2.4rem}
.big .pct{font-family:var(--display);font-weight:700;font-size:20rem;line-height:.9;color:var(--gold);
  background:linear-gradient(180deg,var(--gold-2) 10%,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.big .of{font-size:3.6rem;color:var(--cream)}
.bar{width:128rem;height:1.6rem;border-radius:2rem;background:rgba(236,230,221,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:2rem;background:linear-gradient(to left,var(--gold-2),var(--gold) 40%,var(--teal));
  transition:width 2.4s cubic-bezier(.2,.7,.2,1) .6s}
.facts{display:flex;gap:6.4rem;font-size:2.8rem;color:var(--sky)}
.facts b{color:var(--cream);font-weight:600}

/* verse and hadith */
.ayah{margin:0;font-family:var(--quran);font-size:7.2rem;line-height:2.05;color:var(--cream);max-width:140rem;text-wrap:balance;
  text-shadow:0 .4rem 3rem rgba(0,0,0,.4)}
.ayah .m{color:var(--gold)}
.hadith{margin:0;font-family:var(--display);font-weight:700;font-size:8rem;line-height:1.6;color:var(--cream);max-width:130rem;text-wrap:balance;
  text-shadow:0 .4rem 3rem rgba(0,0,0,.4)}
.src{font-size:2.8rem;color:var(--sky)}

/* chapter progress */
.chapters{position:absolute;right:9.6rem;top:82.4rem;display:flex;gap:1rem}
.chapters span{width:4.8rem;height:.4rem;border-radius:1rem;background:rgba(236,230,221,.22);overflow:hidden}
.chapters span i{display:block;height:100%;width:0;background:var(--gold)}
.chapters span.done i{width:100%}
.chapters span.now i{animation:fill var(--dur,14s) linear forwards}
@keyframes fill{to{width:100%}}

/* ── lower third: prayer times ── */
.lower{position:absolute;right:9.6rem;left:9.6rem;bottom:5.4rem;height:13.6rem;display:flex;align-items:stretch;gap:4.8rem}
.prayers{flex:1;display:grid;grid-template-columns:repeat(6,1fr)}
.p{position:relative;padding-top:2.6rem;text-align:center}
.p::before{content:"";position:absolute;top:0;right:0;left:0;height:.2rem;background:var(--line)}
.p .fillbar{position:absolute;top:-.1rem;right:0;height:.4rem;width:0;background:var(--gold);border-radius:1rem;
  box-shadow:0 0 1.6rem rgba(219,174,106,.7);transition:width 1s linear}
.p .pn{font-size:2.4rem;color:var(--sky)}
.p .pt{margin-top:.8rem;font-family:var(--display);font-weight:700;font-size:4.4rem;color:var(--cream);font-variant-numeric:tabular-nums}
.p.now .pn{color:var(--gold)}
.p.now .pt{color:#fff}
.p.sun{opacity:.6}
.next{flex:none;width:44rem;display:flex;align-items:center;justify-content:space-between;gap:2.4rem;
  padding:0 3.6rem;border-radius:2.4rem;background:linear-gradient(135deg,rgba(0,122,151,.55),rgba(var(--navy-rgb),.65));
  border:1px solid rgba(157,218,229,.28);box-shadow:0 2rem 6rem rgba(0,0,0,.3)}
.next .lbl{font-size:2.2rem;color:var(--sky)}
.next .nm{margin-top:.4rem;font-family:var(--display);font-weight:700;font-size:4.8rem;color:var(--cream);line-height:1.1}
.next .cd{font-family:var(--display);font-weight:700;font-size:6rem;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.next .at{margin-top:.8rem;font-size:2rem;color:var(--sky);text-align:left}

@media (prefers-reduced-motion:reduce){.bg img,.ch .r,.bar i{transition:none;animation:none}}
</style>

<div class="shift" id="shift">
  <div class="bg" id="bg"></div>
  <div class="grade"></div>
  <div class="focus" id="focus"></div>
  <div class="rosette"></div>
</div>
<div class="night" id="night"></div>
<div class="boot" id="boot"></div>

<main class="canvas" id="canvas">
  <header class="top">
    <div class="brand">
      __LOGO__
      <div class="rule"></div>
      <div>
        <h1 id="orgName">جمعية تحفيظ القرآن الكريم ببريدة</h1>
        <p id="orgSub">إدارة الاتصال المؤسسي</p>
      </div>
    </div>
    <div class="when">
      <div class="clock"><span id="clock">—</span><span class="ap" id="ampm"></span></div>
      <div class="dates"><b id="hijri">—</b><i>|</i><span id="greg">—</span></div>
    </div>
  </header>

  <section class="hero" id="hero" aria-live="polite"></section>
  <div class="chapters" id="chapters"></div>

  <footer class="lower">
    <div class="prayers" id="prayers"></div>
    <div class="next">
      <div>
        <div class="lbl">الصلاة القادمة</div>
        <div class="nm" id="nextName">—</div>
      </div>
      <div>
        <div class="cd" id="nextCd">—</div>
        <div class="at" id="nextAt">—</div>
      </div>
    </div>
  </footer>
</main>

<script>
"use strict";
var DEFAULTS = {
  org: "جمعية تحفيظ القرآن الكريم ببريدة",
  sub: "إدارة الاتصال المؤسسي",
  proj: "مبنى الجمعية الجديد", done: 20, target: 100, unit: "%", deadline: "",
  photos: [],
  stats: [
    { title: "ثمار الربع الثالث ١٤٤٨هـ", tiles: [
      { n: "21", l: "خاتمًا للقرآن في برامج الإقراء" },
      { n: "1298", l: "مسجَّلًا في حملة «في كل حي»" },
      { n: "60640", l: "حضورًا في الحِلَق المجتمعية النسائية" },
      { n: "960", l: "نزيلًا استفادوا من الحلقات الإصلاحية" }
    ]},
    { title: "معهد الفتيات — رحلة تبدأ بخطوة", tiles: [
      { n: "1386", l: "تسجيلًا إلكترونيًّا في مسارات المعهد" },
      { n: "745", l: "متقدمة" },
      { n: "572", l: "مقبولة بنسبة ٧٦٫٨٪" },
      { n: "23", l: "جنسية بين المقبولات" }
    ]},
    { title: "البرامج الصيفية ١٤٤٧هـ", tiles: [
      { n: "6", l: "برامج منفذة" },
      { n: "1000", l: "مستفيدة فأكثر" },
      { n: "183", l: "معلمة مؤهلة" },
      { n: "3.85", l: "متوسط التقييم من ٤" }
    ]}
  ],
  ann: [
    { t: "التسجيل في الحلقات الصيفية", b: "فُتح التسجيل لحلقات الصيف في جميع الفروع، والمقاعد محدودة.", w: "حتى نهاية الشهر" },
    { t: "حفل تكريم الحفاظ", b: "تكريم خاتمي القرآن الكريم لهذا العام بحضور أعضاء مجلس الإدارة.", w: "الخميس — ٨:٠٠ مساءً" }
  ]
};
var AYAT = [
  { t: "وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ", s: "القمر ١٧" },
  { t: "أَفَلَا يَتَدَبَّرُونَ ٱلْقُرْءَانَ أَمْ عَلَىٰ قُلُوبٍ أَقْفَالُهَآ", s: "محمد ٢٤" },
  { t: "كِتَٰبٌ أَنزَلْنَٰهُ إِلَيْكَ مُبَٰرَكٌۭ لِّيَدَّبَّرُوٓا۟ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُو۟لُوا۟ ٱلْأَلْبَٰبِ", s: "ص ٢٩" },
  { t: "أَوْ زِدْ عَلَيْهِ وَرَتِّلِ ٱلْقُرْءَانَ تَرْتِيلًا", s: "المزمل ٤" }
];
var AHADITH = [
  { t: "خيركم من تعلّم القرآن وعلّمه", s: "رواه البخاري" },
  { t: "الماهر بالقرآن مع السفرة الكرام البررة", s: "متفق عليه" },
  { t: "اقرؤوا القرآن فإنه يأتي يوم القيامة شفيعًا لأصحابه", s: "رواه مسلم" },
  { t: "من قرأ حرفًا من كتاب الله فله به حسنة، والحسنة بعشر أمثالها", s: "رواه الترمذي" }
];
var STATS_MS = 16000, OTHER_MS = 13000;
var BUILDING = "data:image/jpeg;base64,__BUILDING__";

/* prayer times for Buraydah, computed on the device (Umm al-Qurā) */
var LAT = 26.3260, LNG = 43.9750, TZ = 3;
function rad(d){ return d * Math.PI / 180 }
function deg(r){ return r * 180 / Math.PI }
function julian(y, m, d){
  if (m <= 2) { y -= 1; m += 12 }
  var A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function solar(JD){
  var T = (JD - 2451545) / 36525;
  var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  var e = 0.016708634 - 0.000042037 * T;
  var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(rad(M))
        + (0.019993 - 0.000101 * T) * Math.sin(rad(2 * M))
        + 0.000289 * Math.sin(rad(3 * M));
  var omega = 125.04 - 1934.136 * T;
  var lambda = L0 + C - 0.00569 - 0.00478 * Math.sin(rad(omega));
  var eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  var eps = eps0 + 0.00256 * Math.cos(rad(omega));
  var decl = deg(Math.asin(Math.sin(rad(eps)) * Math.sin(rad(lambda))));
  var y = Math.pow(Math.tan(rad(eps / 2)), 2);
  var eq = (y * Math.sin(2 * rad(L0)) - 2 * e * Math.sin(rad(M))
          + 4 * e * y * Math.sin(rad(M)) * Math.cos(2 * rad(L0))
          - 0.5 * y * y * Math.sin(4 * rad(L0)) - 1.25 * e * e * Math.sin(2 * rad(M)));
  return { decl: decl, eq: deg(eq) * 4 };
}
function prayerTimes(date){
  var JD = julian(date.getFullYear(), date.getMonth() + 1, date.getDate()) + 0.5 - LNG / 360;
  var s = solar(JD), decl = s.decl;
  var dhuhr = 12 + TZ - LNG / 15 - s.eq / 60;
  function ha(angle){
    var c = (-Math.sin(rad(angle)) - Math.sin(rad(LAT)) * Math.sin(rad(decl)))
          / (Math.cos(rad(LAT)) * Math.cos(rad(decl)));
    return deg(Math.acos(Math.max(-1, Math.min(1, c)))) / 15;
  }
  var asrAngle = deg(Math.atan(1 / (1 + Math.tan(rad(Math.abs(LAT - decl))))));
  var ac = (Math.sin(rad(asrAngle)) - Math.sin(rad(LAT)) * Math.sin(rad(decl)))
         / (Math.cos(rad(LAT)) * Math.cos(rad(decl)));
  var asrH = deg(Math.acos(Math.max(-1, Math.min(1, ac)))) / 15;
  var maghrib = dhuhr + ha(0.833);
  return [
    { k: "fajr",    n: "الفجر",  h: dhuhr - ha(18.5) },
    { k: "sunrise", n: "الشروق", h: dhuhr - ha(0.833) },
    { k: "dhuhr",   n: "الظهر",  h: dhuhr },
    { k: "asr",     n: "العصر",  h: dhuhr + asrH },
    { k: "maghrib", n: "المغرب", h: maghrib },
    { k: "isha",    n: "العشاء", h: maghrib + 1.5 }
  ];
}
function pad(n){ return (n < 10 ? "0" : "") + n }
function hm(h){
  var m = Math.round(h * 60); m = ((m % 1440) + 1440) % 1440;
  var hh = Math.floor(m / 60), h12 = hh % 12 === 0 ? 12 : hh % 12;
  return pad(h12) + ":" + pad(m % 60);
}
function counted(n, one, two, few, many){
  if (n === 1) return one;
  if (n === 2) return two;
  if (n >= 3 && n <= 10) return ar(n) + " " + few;
  return ar(n) + " " + many;
}
function untilText(h, m){
  if (h <= 0 && m <= 0) return "بعد أقل من دقيقة";
  var parts = [];
  if (h > 0) parts.push(counted(h, "ساعة", "ساعتين", "ساعات", "ساعة"));
  if (m > 0) parts.push(counted(m, "دقيقة", "دقيقتين", "دقائق", "دقيقة"));
  return "بعد " + parts.join(" و");
}
function ar(n){ return String(n).replace(/\d/g, function(d){ return "٠١٢٣٤٥٦٧٨٩"[+d] }) }
function decimals(n){ var m = String(n).match(/\.(\d+)$/); return m ? m[1].length : 0 }
function num(v, dp){
  if (!isFinite(Number(v))) return ar(String(v));
  var s = Number(v).toLocaleString("en-US", { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0, useGrouping: false });
  return ar(s).replace(".", "٫");
}
function el(tag, cls, text){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text != null) d.textContent = text;
  return d;
}

var state = JSON.parse(JSON.stringify(DEFAULTS));
var preview = /[#&]s=(\d+)/.exec(location.hash);   // #s=N: hold chapter N (for checking a layout)

/* ── photographs ── */
var bg = document.getElementById("bg"), bgIdx = -1;
function renderBg(){
  bg.textContent = "";
  (state.photos || []).forEach(function(p){
    var im = document.createElement("img");
    im.src = typeof p === "string" ? p : p.id; im.alt = ""; im.decoding = "async";
    if (typeof p === "object" && p.dim) im.style.filter = "brightness(" + Math.min(1, p.dim * 1.4).toFixed(2) + ")";
    bg.appendChild(im);
  });
  bgIdx = -1;
}
function nextBg(){
  var k = bg.children;
  if (!k.length) return;
  var old = bgIdx >= 0 ? k[bgIdx] : null;
  bgIdx = (bgIdx + 1) % k.length;
  if (old && old !== k[bgIdx]) {
    old.classList.remove("on"); old.classList.add("out");
    setTimeout(function(){ old.classList.remove("out") }, 2600);
  }
  k[bgIdx].classList.remove("out"); k[bgIdx].classList.add("on");
}

/* ── chapters ── */
var hero = document.getElementById("hero"), chaptersEl = document.getElementById("chapters");
var chapters = [], at = -1, timer = null;
function buildChapters(){
  var day = Math.floor(Date.now() / 86400000);
  var a = AYAT[day % AYAT.length], h = AHADITH[day % AHADITH.length];
  var stats = (state.stats || []).map(function(g){ return { kind: "stats", group: g } });
  var others = [{ kind: "ayah", text: a.t, src: a.s }];
  (state.ann || []).forEach(function(x){ others.push({ kind: "ann", title: x.t, body: x.b, when: x.w }) });
  if (state.target) others.push({ kind: "proj" });
  others.push({ kind: "hadith", text: h.t, src: h.s });
  var out = [];   // achievements lead, and come back between everything else
  while (stats.length || others.length) {
    if (stats.length) out.push(stats.shift());
    if (others.length) out.push(others.shift());
  }
  return out;
}
function reveal(node, i){ node.classList.add("r"); node.style.setProperty("--d", (0.15 + i * 0.14).toFixed(2) + "s"); return node }
function chapterEl(c){
  var d = el("div", "ch " + c.kind), i = 0;
  if (c.kind === "stats") {
    d.appendChild(reveal(el("div", "kicker", "إنجازاتنا"), i++));
    d.appendChild(reveal(el("h2", null, c.group.title || "أرقامنا"), i++));
    var figs = el("div", "figs");
    (c.group.tiles || []).forEach(function(t){
      if (!t.n) return;
      var f = reveal(el("div", "fig"), i++);
      var n = el("div", "n", num(0, decimals(t.n)));
      n.dataset.v = t.n;
      f.appendChild(n); f.appendChild(el("div", "l", t.l));
      figs.appendChild(f);
    });
    d.appendChild(figs);
  } else if (c.kind === "ann") {
    d.appendChild(reveal(el("div", "kicker", "إعلان"), i++));
    d.appendChild(reveal(el("h2", null, c.title || ""), i++));
    if (c.body) d.appendChild(reveal(el("p", "body", c.body), i++));
    if (c.when) d.appendChild(reveal(el("div", "pill", c.when), i++));
  } else if (c.kind === "proj") {
    var pct = Math.max(0, Math.min(100, Math.round((Number(state.done) / Number(state.target)) * 100)));
    var txt = el("div", "txt");
    txt.appendChild(reveal(el("div", "kicker", "مشروع قائم"), i++));
    txt.appendChild(reveal(el("h2", null, state.proj || "مشروع قائم"), i++));
    var big = reveal(el("div", "big"), i++);
    var p = el("div", "pct", ar(0) + "٪"); p.dataset.v = pct; p.dataset.suffix = "٪";
    big.appendChild(p); big.appendChild(el("div", "of", "مكتمل"));
    txt.appendChild(big);
    // the render's ground line and roof line, as shares of the picture's height
    var bld = reveal(el("div", "bld"), 1), cut = (92 - pct * (92 - 7) / 100).toFixed(2) + "%";
    var ghost = el("img", "ghost"); ghost.src = BUILDING; ghost.alt = "";
    var lit = el("img", "lit"); lit.src = BUILDING; lit.alt = "مبنى الجمعية الجديد";
    var lvl = el("div", "lvl"); lvl.appendChild(el("span", null, ar(pct) + "٪"));
    lit.dataset.cut = lvl.dataset.cut = cut;
    bld.appendChild(ghost); bld.appendChild(lit); bld.appendChild(lvl);
    d.appendChild(txt); d.appendChild(bld);
    var facts = reveal(el("div", "facts"), i++);
    var unit = state.unit === "%" ? "٪" : " " + (state.unit || "");
    if (state.unit !== "%") {   // a percentage already says it all
      var f1 = el("div"); f1.appendChild(document.createTextNode("المنجز "));
      f1.appendChild(el("b", null, num(state.done) + unit));
      f1.appendChild(document.createTextNode(" من " + num(state.target) + unit));
      facts.appendChild(f1);
    }
    if (state.deadline) {
      var days = Math.ceil((new Date(state.deadline + "T00:00:00") - new Date()) / 86400000);
      if (isFinite(days)) facts.appendChild(el("div", null,
        days >= 0 ? "باقٍ " + ar(days) + " يومًا للتسليم" : "تجاوز الموعد بـ" + ar(-days) + " يومًا"));
    }
    txt.appendChild(facts);
  } else if (c.kind === "ayah") {
    d.appendChild(reveal(el("div", "kicker", "آية اليوم"), i++));
    var q = reveal(el("p", "ayah"), i++);
    q.appendChild(el("span", "m", "﴿ ")); q.appendChild(document.createTextNode(c.text)); q.appendChild(el("span", "m", " ﴾"));
    d.appendChild(q);
    d.appendChild(reveal(el("div", "src", c.src), i++));
  } else if (c.kind === "hadith") {
    d.appendChild(reveal(el("div", "kicker", "حديث"), i++));
    d.appendChild(reveal(el("p", "hadith", "«" + c.text + "»"), i++));
    d.appendChild(reveal(el("div", "src", c.src), i++));
  }
  return d;
}
function countUp(root){
  var nodes = root.querySelectorAll("[data-v]"), t0 = performance.now() + 500, dur = 2000;
  function frame(t){
    var k = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 4);
    Array.prototype.forEach.call(nodes, function(n){
      var v = Number(n.dataset.v), dp = decimals(n.dataset.v);
      n.textContent = num(v * e, dp) + (n.dataset.suffix || "");
    });
    if (k < 1 && root.classList.contains("on")) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  Array.prototype.forEach.call(root.querySelectorAll(".bld [data-cut]"), function(x){
    if (x.classList.contains("lit")) x.style.clipPath = "inset(" + x.dataset.cut + " 0 0 0)";
    else x.style.top = x.dataset.cut;
  });
}
function renderChapters(){
  hero.textContent = ""; chaptersEl.textContent = "";
  chapters = buildChapters();
  chapters.forEach(function(c){
    hero.appendChild(chapterEl(c));
    var s = el("span"); s.appendChild(el("i")); chaptersEl.appendChild(s);
  });
  at = preview ? (+preview[1] - 2) % chapters.length : -1;
  if (preview && bg.children.length) bgIdx = at % bg.children.length;
  advance();
}
function advance(){
  var k = hero.children, dots = chaptersEl.children;
  if (!k.length) return;
  var prev = at >= 0 ? k[at] : null;
  at = (at + 1) % k.length;
  if (prev && prev !== k[at]) {
    prev.classList.remove("on"); prev.classList.add("leaving");
    setTimeout(function(){
      prev.classList.remove("leaving");
      Array.prototype.forEach.call(prev.querySelectorAll(".bld [data-cut]"), function(x){ x.style.clipPath = ""; x.style.top = "" });
    }, 600);
  }
  var ms = chapters[at].kind === "stats" ? STATS_MS : OTHER_MS;
  document.getElementById("focus").classList.toggle("on", chapters[at].kind === "proj");
  setTimeout(function(){ k[at].classList.add("on"); countUp(k[at]) }, prev ? 450 : 0);
  Array.prototype.forEach.call(dots, function(d, i){
    d.className = i < at ? "done" : "";
    d.style.removeProperty("--dur");
  });
  void chaptersEl.offsetWidth;   // restart the fill animation
  dots[at].className = "now"; dots[at].style.setProperty("--dur", ms + "ms");
  nextBg();
  if (timer) clearTimeout(timer);
  if (!preview) timer = setTimeout(advance, ms);
}
function renderHeader(){
  document.getElementById("orgName").textContent = state.org || DEFAULTS.org;
  document.getElementById("orgSub").textContent = state.sub || "";
}

/* ── clock, dates, prayer times ── */
var prayersEl = document.getElementById("prayers");
function renderPrayers(times, activeKey, frac){
  if (prayersEl.children.length !== times.length) {
    prayersEl.textContent = "";
    times.forEach(function(t){
      var d = el("div", "p" + (t.k === "sunrise" ? " sun" : ""));
      d.appendChild(el("div", "fillbar"));
      d.appendChild(el("div", "pn", t.n)); d.appendChild(el("div", "pt"));
      prayersEl.appendChild(d);
    });
  }
  Array.prototype.forEach.call(prayersEl.children, function(d, i){
    d.querySelector(".pt").textContent = ar(hm(times[i].h));
    var on = times[i].k === activeKey;
    d.classList.toggle("now", on);
    d.querySelector(".fillbar").style.width = on ? (frac * 100).toFixed(2) + "%" : "0";
  });
}
function tick(){
  var now = new Date(), h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  var h12 = h % 12 === 0 ? 12 : h % 12;
  document.getElementById("clock").textContent = ar(pad(h12) + ":" + pad(m));
  document.getElementById("ampm").textContent = h < 12 ? "صباحًا" : "مساءً";

  var hj;
  try {
    hj = new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-arab",
      { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(now);
    if (!/هـ|هـ|AH/.test(hj)) hj += " هـ";
  } catch (e) { hj = new Intl.DateTimeFormat("ar-SA", { weekday: "long" }).format(now) }
  document.getElementById("hijri").textContent = hj;
  document.getElementById("greg").textContent =
    new Intl.DateTimeFormat("ar-EG", { day: "numeric", month: "long", year: "numeric" }).format(now) + " م";

  var times = prayerTimes(now), nowH = h + m / 60 + s / 3600, next = null;
  for (var i = 0; i < times.length; i++) {
    if (times[i].k === "sunrise") continue;
    if (times[i].h > nowH) { next = times[i]; break }
  }
  var tomorrow = false;
  if (!next) { next = prayerTimes(new Date(now.getTime() + 86400000))[0]; tomorrow = true }
  var diff = (next.h - nowH + (tomorrow ? 24 : 0)) * 3600;
  var hh = Math.floor(diff / 3600), mm = Math.floor((diff % 3600) / 60), ss = Math.floor(diff % 60);
  document.getElementById("nextName").textContent = next.n;
  document.getElementById("nextCd").textContent = ar((hh > 0 ? pad(hh) + ":" : "") + pad(mm) + ":" + pad(ss));
  document.getElementById("nextAt").textContent = untilText(hh, mm);

  var active = null, startH = 0;
  for (var j = times.length - 1; j >= 0; j--) {
    if (times[j].k === "sunrise") continue;
    if (times[j].h <= nowH) { active = times[j].k; startH = times[j].h; break }
  }
  if (!active) { active = "isha"; startH = prayerTimes(new Date(now.getTime() - 86400000))[5].h - 24 }
  var span = (next.h + (tomorrow ? 24 : 0)) - startH;
  renderPrayers(times, active, span > 0 ? Math.max(0, Math.min(1, (nowH - startH) / span)) : 0);
}

renderHeader(); renderBg(); renderChapters(); tick(); setInterval(tick, 1000);

/* ── always-on behaviour: night dimming, burn-in shift, one clean fade-in ── */
var nightEl = document.getElementById("night");
function dimForHour(){
  var h = new Date().getHours() + new Date().getMinutes() / 60;
  var o = 0;
  if (h >= 23 || h < 5) o = .46;
  else if (h >= 21) o = .46 * (h - 21) / 2;
  else if (h < 7) o = .46 * (7 - h) / 2;
  nightEl.style.opacity = o.toFixed(3);
}
dimForHour(); setInterval(dimForHour, 60000);

var SHIFTS = [[0,0],[4,2],[8,0],[6,-3],[0,-4],[-5,-2],[-7,2]], shiftAt = 0;
var shiftEl = document.getElementById("shift"), canvasEl = document.getElementById("canvas");
function nudge(){
  var s = SHIFTS[shiftAt = (shiftAt + 1) % SHIFTS.length];
  shiftEl.style.transform = "translate(" + s[0] + "px," + s[1] + "px)";
  canvasEl.style.transform = "translate(calc(-50% + " + s[0] + "px),calc(-50% + " + s[1] + "px))";
}
setInterval(nudge, 240000);

function ready(){ setTimeout(function(){ document.getElementById("boot").classList.add("gone") }, 250) }
if (document.readyState === "complete") ready(); else window.addEventListener("load", ready);
setTimeout(ready, 2500);   // never hold the cover over a slow photo

(async function(){
  try { if (navigator.wakeLock) { await navigator.wakeLock.request("screen").catch(function(){}) } } catch (e) {}
  if (!window.claude || !window.claude.use) return;
})();
</script>
